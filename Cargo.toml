[package]
name = "woopwoop"
version = "0.3.1"
edition = "2021"
description = "A small, fast address geocoder. Finds anywhere, even out in woop woop."
license = "Apache-2.0"
repository = "https://github.com/Nosdesk/woopwoop"
keywords = ["geocoding", "address", "gnaf", "geocoder", "maps"]
categories = ["science::geo"]
readme = "README.md"
exclude = ["docs/", ".github/", "eval/*.tsv", "*.pack", "tiles/", "eval/osm_addresses/"]

[dependencies]
fst = "0.4"
memmap2 = "0.9"

[profile.release]
opt-level = 3
lto = "thin"

[workspace]
members = ["tiles"]
exclude = ["eval/osm_addresses"]

[profile.wasm]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
